services:
  api:
    build: ./backend
    environment:
      MARKET_TICK_INTERVAL: ${MARKET_TICK_INTERVAL:-0.25}
      MARKET_RANDOM_SEED: ${MARKET_RANDOM_SEED:-42}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: ["4200:80"]
